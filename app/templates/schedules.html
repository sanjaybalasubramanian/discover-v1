<!DOCTYPE html>
<html>
<head><title>Schedules</title></head>
<body>
<h1>Schedule Management</h1>
<a href="/dashboard">Back</a>
<h2>Add Schedule</h2>
<form method="POST" action="/dashboard/schedules/create">
<input name="name" placeholder="Name" required><br>
<input name="hour" type="number" min="0" max="23" value="8" required> : <input name="minute" type="number" min="0" max="59" value="30" required><br>
<input name="max_jobs" type="number" value="50"><br>
<input type="checkbox" name="enabled" checked> Enabled<br>
<input name="password" type="password" required><br>
<button>Create</button>
</form>
<h2>Active Schedules</h2>
<table>
{% for schedule in schedules %}
<tr>
<td>{{ schedule.name }}</td>
<td>{{ schedule.cron_expression }}</td>
<td>{{ schedule.enabled }}</td>
<td>
<form method="POST" action="/dashboard/schedules/{{ schedule.id }}/toggle">
<input name="password" type="password" required>
<button>Toggle</button>
</form>
<form method="POST" action="/dashboard/schedules/{{ schedule.id }}/delete">
<input name="password" type="password" required>
<button>Delete</button>
</form>
</td>
</tr>
{% endfor %}
</table>
</body>
</html>
