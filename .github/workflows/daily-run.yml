name: Daily Job Outreach Pipeline

on:
  # Run daily at 08:30 IST (03:00 UTC)
  schedule:
    - cron: '0 3 * * *'
  
  # Allow manual trigger from dashboard or GitHub UI
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Maximum jobs to process'
        required: false
        default: '50'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for full pipeline
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install system dependencies for Crawl4AI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            chromium-chromedriver \
            libnss3 \
            libxss1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libgtk-3-0
      
      - name: Install Python dependencies with UV
        run: |
          uv sync --frozen
      
      - name: Install Playwright browsers (for Crawl4AI)
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium
      
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL: ${{ secrets.BEDROCK_MODEL }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI }}
          ABSTRACT_API_KEY: ${{ secrets.ABSTRACT_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          uv run python -m app.cli run
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            *.log
            logs/
          retention-days: 7
      
      - name: Notify on failure (optional)
        if: failure()
        run: |
          echo "Pipeline failed! Check logs in artifacts."
          # You can add Slack/Discord/email notification here
